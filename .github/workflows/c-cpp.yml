name: SteamWorks.ext Build

on:
  push:
    branches: [ x64 ]
  pull_request:
    branches: [ x64 ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ 3.11 ]
        os: [ windows-latest, ubuntu-22.04 ]

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Deps
      if: runner.os == 'Linux'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get install bash lib32z1-dev libc6-dev-i386
        sudo apt-get install g++-multilib
    - uses: actions/checkout@v2
      name: Clone AMBuild
      with:
        repository: 'alliedmodders/ambuild'
        path: 'assets/ambuild'
    - name: install AMBuild
      run: pip install ./assets/ambuild
    - uses: actions/checkout@v2
      name: Clone SteamworksSDK
      with:
        repository: 'irql-notlessorequal/SteamworksSDK'
        path: 'assets/SteamworksSDK'
        token: ${{ secrets.STEAMWORKS_SDK_OAUTH }}
    - uses: actions/checkout@v2
      name: Clone hl2sdk-sdk2013
      with:
        repository: 'alliedmodders/hl2sdk'
        ref: 'sdk2013'
        path: 'assets/hl2sdk-sdk2013'
    - uses: actions/checkout@v2
      name: Clone Metamod Source
      with:
        repository: 'alliedmodders/metamod-source'
        ref: '1.12-dev'
        path: 'assets/mmsource-central'
    - uses: actions/checkout@v3
      name: Clone Sourcemod
      with:
        repository: 'alliedmodders/sourcemod'
        submodules: recursive
        ref: '1.12-dev'
        path: 'assets/sourcemod-central'
    - name: Create redundant AMBuildScript
      run: cp AMBuildScript ../
    - name: Run build script
      run: |
        cd build
        bash ./build
    - uses: actions/upload-artifact@v4
      name: Upload build artifacts
      with:
        name: steamworks-x64-git
        path: build/pacakge
        if-no-files-found: error
        retention-days: 90
